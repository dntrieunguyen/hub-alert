name: 💡 Feature Request
description: Propose a new feature, feed, or collector enhancement for Hub Alert
labels: ['enhancement']

body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea or enhancement for Hub Alert.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the proposal.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Use Case
      description: Why would this feature or feed source be useful?
